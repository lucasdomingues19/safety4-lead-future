<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lora:ital,wght@1,500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --ink:#0E0E33; --indigo:#202058; --lime:#9EFF1F; --blue:#3434FF; --soft:#8F8FFF; --mist:#CFCFDB; --white:#FAFAFA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; background:var(--ink); }
  .plate { position:relative; width:1280px; height:720px; overflow:hidden;
    background: radial-gradient(120% 140% at 85% 30%, #2A2A78 0%, #1A1A4C 45%, #0E0E33 100%); }
  .grid { position:absolute; inset:0; opacity:.07;
    background-image: linear-gradient(var(--mist) 1px, transparent 1px), linear-gradient(90deg, var(--mist) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: linear-gradient(90deg, transparent 0%, #000 45%, #000 100%); }
  canvas { position:absolute; inset:0; }
  .copy { position:absolute; left:80px; top:72px; bottom:72px; width:640px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:14px; color:var(--white); font:600 17px/1 Poppins, sans-serif; letter-spacing:.22em; }
  .brand svg { width:34px; height:26px; }
  .eyebrow { margin-top:auto; align-self:flex-start; border:1.5px solid var(--lime); color:var(--lime); border-radius:999px;
    padding:9px 18px 8px; font:600 15px/1 Poppins, sans-serif; letter-spacing:.2em; }
  h1 { margin-top:26px; color:var(--white); font:700 82px/1.02 Poppins, sans-serif; letter-spacing:-.025em; text-wrap:balance; }
  h1 em { font-style:normal; color:var(--lime); }
  .sub { margin-top:22px; color:var(--mist); font:500 italic 30px/1.3 Lora, serif; max-width:600px; }
  .meta { margin-top:34px; display:flex; gap:26px; color:#A9A9C8; font:500 15px/1 "JetBrains Mono", monospace; letter-spacing:.08em; text-transform:uppercase; }
  .meta span { display:flex; align-items:center; gap:10px; }
  .meta span::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--lime); }
  .rule { position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--lime); }
</style></head>
<body>
<div class="plate">
  <div class="grid"></div>
  <canvas id="c" width="2560" height="1440" style="width:1280px;height:720px"></canvas>
  <div class="rule"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 34 26"><path d="M0 0h8l11 13L8 26H0l11-13z" fill="#9EFF1F"/><path d="M15 0h8l11 13-11 13h-8l11-13z" fill="#9EFF1F"/></svg>
      SAFETYTECH ACADEMY
    </div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>
<script>
const COURSES = {
  ai: { eyebrow: "FOUNDATION COURSE", title: "Fundamentals of <em>AI</em> in EHS", sub: "Understand it. Use it. Govern it.", meta: ["8 lessons", "4 quizzes", "Certificate"] },
  s4: { eyebrow: "IOSH-APPROVED COURSE", title: "Safety <em>4.0</em>", sub: "Leading safety in the digital age", meta: ["10 modules", "IOSH approved", "Certificate"] },
  cp: { eyebrow: "PRACTITIONER COURSE", title: "<em>Copilot</em> for EHS &amp; Sustainability", sub: "Microsoft 365 Copilot, put to work in EHS", meta: ["10 modules", "Microsoft 365", "Self-paced"], size: 70 },
};
const key = new URLSearchParams(location.search).get("c") || "ai";
const C = COURSES[key];
document.getElementById("eyebrow").textContent = C.eyebrow;
document.getElementById("title").innerHTML = C.title;
if (C.size) document.getElementById("title").style.fontSize = C.size + "px";
document.getElementById("sub").textContent = C.sub;
document.getElementById("meta").innerHTML = C.meta.map((m) => `<span>${m}</span>`).join("");

// Deterministic randomness so every render is identical.
let seed = { ai: 7, s4: 11, cp: 23 }[key];
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

document.fonts.ready.then(() => {
const cv = document.getElementById("c"), g = cv.getContext("2d");
g.scale(2, 2);
const LIME = "#9EFF1F", SOFT = "rgba(143,143,255,", WHITE = "rgba(250,250,250,";

function dot(x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function glow(x, y, r) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, "rgba(158,255,31,.35)"); gr.addColorStop(1, "rgba(158,255,31,0)");
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}


// Wireframe hard hat: dome grid, front peak, centre ridge and brim, projected in 3D.
// Lines facing away from the viewer fade, like a hologram.
function helmet(o) {
  const { cx, cy, R, yaw = 0.5, pitch = 0.32, color = "143,143,255", alpha = 0.6, dash = null, width = 1.3 } = o;
  const H = 0.98 * R, ca = Math.cos(yaw), sa = Math.sin(yaw), cb = Math.cos(pitch), sb = Math.sin(pitch);
  const P = (x, y, z) => { const x1 = x * ca + z * sa, z1 = -x * sa + z * ca; return { x: cx + x1, y: cy + y * cb - z1 * sb, d: y * sb + z1 * cb }; };
  const prof = (t) => Math.pow(Math.sin(t), 0.7);
  const dome = (t, f, k = 1) => P(R * k * prof(t) * Math.cos(f), -H * k * Math.cos(t), 1.12 * R * k * prof(t) * Math.sin(f));
  const brimR = (f) => R * (1.07 + 0.5 * Math.pow(Math.max(0, -Math.sin(f)), 1.8) + 0.06 * Math.pow(Math.max(0, Math.sin(f)), 2));
  const brim = (f, r) => P(r * Math.cos(f), 0.03 * R + 0.16 * (r - R), 1.12 * r * Math.sin(f));
  const line = (pts, a = alpha) => {
    g.setLineDash(dash || []);
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], q = pts[i], back = (p.d + q.d) / 2 > 0;
      g.strokeStyle = `rgba(${color},${back ? a * 0.22 : a})`; g.lineWidth = width;
      g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
    }
    g.setLineDash([]);
  };
  const N = 64, T = Math.PI / 2;
  // Faint solid body: dome and brim filled separately so the peak keeps its true outline.
  const hullOf = (cloud) => {
    cloud.sort((a, b) => a.x - b.x || a.y - b.y);
    const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
    const lo = [], hi = [];
    for (const p of cloud) { while (lo.length > 1 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of [...cloud].reverse()) { while (hi.length > 1 && cross(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
    return lo.slice(0, -1).concat(hi.slice(0, -1));
  };
  const fillPoly = (pts, fill) => { g.fillStyle = fill; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y))); g.closePath(); g.fill(); };
  const body = g.createLinearGradient(cx, cy - H, cx, cy + R * 0.4);
  body.addColorStop(0, `rgba(${color},0.16)`); body.addColorStop(1, `rgba(${color},0.04)`);
  fillPoly(Array.from({ length: 97 }, (_, i) => { const f = (i / 96) * Math.PI * 2; return brim(f, brimR(f)); }), `rgba(${color},0.05)`);
  const domePts = []; for (let i = 0; i <= 48; i++) for (let k = 0; k <= 8; k++) domePts.push(dome((k / 8) * T, (i / 48) * Math.PI * 2));
  fillPoly(hullOf(domePts), body);
  for (let m = 0; m < 18; m++) { const f = (m / 18) * Math.PI * 2; line(Array.from({ length: 25 }, (_, i) => dome((i / 24) * T, f))); }
  for (let k = 1; k <= 6; k++) { const t = (k / 6) * T; line(Array.from({ length: N + 1 }, (_, i) => dome(t, (i / N) * Math.PI * 2)), k === 6 ? alpha * 1.4 : alpha); }
  for (const off of [-0.09, 0.09]) line(Array.from({ length: 25 }, (_, i) => dome((i / 24) * T * 0.98, Math.PI / 2 + off, 1.05)), alpha * 1.3);
  for (const off of [-0.09, 0.09]) line(Array.from({ length: 25 }, (_, i) => dome((i / 24) * T * 0.98, -Math.PI / 2 + off, 1.05)), alpha * 1.3);
  line(Array.from({ length: N + 1 }, (_, i) => { const f = (i / N) * Math.PI * 2; return brim(f, brimR(f)); }), alpha * 1.4);
  for (let m = 0; m < 36; m++) { const f = (m / 36) * Math.PI * 2; line([brim(f, R * 1.0), brim(f, brimR(f))], alpha * 0.55); }
  return { dome, P, R };
}
// Nodes on the visible side of the dome, joined to their neighbours.
function network(h, n, maxD, opts = {}) {
  const pts = [];
  while (pts.length < n) {
    const t = 0.15 + rnd() * 1.15, f = rnd() * Math.PI * 2, p = h.dome(t, f, 1.0);
    if (p.d < -h.R * 0.3) pts.push(p);
  }
  g.lineWidth = opts.width || 1.6;
  pts.forEach((a, i) => pts.slice(i + 1).forEach((b) => {
    const dd = Math.hypot(a.x - b.x, a.y - b.y);
    if (dd < maxD) { g.strokeStyle = `rgba(158,255,31,${0.85 - dd / maxD * 0.5})`; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
  }));
  pts.forEach((p, i) => { if (i % 4 === 0) glow(p.x, p.y, 26); dot(p.x, p.y, i % 4 === 0 ? 6 : 4, LIME); });
}
if (key === "ai") {
  // Holographic hard hat with an AI network running across it.
  const h = helmet({ cx: 1010, cy: 470, R: 215, yaw: 1.05, pitch: 0.34, alpha: 0.55 });
  network(h, 20, 120);
}

if (key === "s4") {
  // Industrial revolutions 1.0 to 3.0 as stacked planes; 4.0 is a connected hard hat on top.
  const cx = 1000, base = 610, w = 190, h = 95, step = 100;
  for (let i = 0; i < 3; i++) {
    const y = base - i * step;
    g.beginPath(); g.moveTo(cx, y - h); g.lineTo(cx + w, y); g.lineTo(cx, y + h); g.lineTo(cx - w, y); g.closePath();
    g.fillStyle = `rgba(52,52,255,${0.10 + i * 0.05})`; g.fill();
    g.strokeStyle = SOFT + (0.35 + i * 0.12) + ")"; g.lineWidth = 1.5; g.stroke();
    g.font = '500 13px "JetBrains Mono"'; g.fillStyle = WHITE + ".5)"; g.textAlign = "left";
    g.fillText((i + 1) + ".0", cx + w + 24, y + 5);
    g.strokeStyle = WHITE + ".25)"; g.lineWidth = 1; g.beginPath(); g.moveTo(cx + w + 4, y); g.lineTo(cx + w + 18, y); g.stroke();
  }
  const top = base - 3 * step - 55;
  glow(cx, top - 60, 170);
  const hh = helmet({ cx, cy: top, R: 128, yaw: 1.05, pitch: 0.48, color: "158,255,31", alpha: 0.75, dash: [3, 5], width: 1.6 });
  network(hh, 12, 95, { width: 1.4 });
  g.font = '500 13px "JetBrains Mono"'; g.fillStyle = LIME; g.textAlign = "left"; g.fillText("4.0", cx + w + 24, top + 5);
  g.strokeStyle = LIME; g.lineWidth = 1; g.beginPath(); g.moveTo(cx + w + 4, top); g.lineTo(cx + w + 18, top); g.stroke();
}

if (key === "cp") {
  // A navigation instrument: range rings, a heading line and a plotted course to a waypoint.
  const cx = 1040, cy = 360;
  for (let r = 70; r <= 280; r += 70) {
    g.strokeStyle = SOFT + (0.45 - r / 900) + ")"; g.lineWidth = 1.2; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  }
  for (let a = 0; a < 360; a += 10) {
    const rad = (a * Math.PI) / 180, long = a % 30 === 0, r1 = 280, r2 = long ? 262 : 270;
    g.strokeStyle = WHITE + (long ? ".55)" : ".25)"); g.lineWidth = long ? 1.5 : 1;
    g.beginPath(); g.moveTo(cx + Math.cos(rad) * r1, cy + Math.sin(rad) * r1); g.lineTo(cx + Math.cos(rad) * r2, cy + Math.sin(rad) * r2); g.stroke();
  }
  g.strokeStyle = WHITE + ".18)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx - 290, cy); g.lineTo(cx + 290, cy); g.moveTo(cx, cy - 290); g.lineTo(cx, cy + 290); g.stroke();
  // Plotted course: dashed curve from the centre to a waypoint.
  const wp = { x: cx + 168, y: cy - 150 };
  g.setLineDash([7, 8]); g.strokeStyle = LIME; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(cx - 150, cy + 170); g.bezierCurveTo(cx - 60, cy + 40, cx + 40, cy + 30, wp.x, wp.y); g.stroke(); g.setLineDash([]);
  [[cx - 150, cy + 170], [cx - 32, cy + 62]].forEach(([x, y]) => { dot(x, y, 5, "#1A1A4C"); g.strokeStyle = LIME; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 5, 0, Math.PI * 2); g.stroke(); });
  glow(wp.x, wp.y, 50); dot(wp.x, wp.y, 9, LIME);
  g.strokeStyle = LIME; g.lineWidth = 1.5; g.beginPath(); g.arc(wp.x, wp.y, 20, 0, Math.PI * 2); g.stroke();
  g.font = '500 13px "JetBrains Mono"'; g.fillStyle = LIME; g.textAlign = "right"; g.fillText("WAYPOINT", wp.x - 32, wp.y - 18);
  // Fading blips.
  for (let k = 0; k < 9; k++) { const a = rnd() * Math.PI * 2, r = 60 + rnd() * 200; dot(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 2.5, SOFT + ".7)"); }
}
});
</script>
</body></html>
