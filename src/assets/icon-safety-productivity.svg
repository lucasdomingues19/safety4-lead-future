<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Safety Performance & Productivity -->
  <g transform="translate(100, 90)">
    <!-- Shield (safety) -->
    <path d="M -5 -30 L 15 -18 L 15 -5 Q 0 10 0 10 Q -15 -5 -15 -18 Z" fill="#3B82F6" stroke="#000" stroke-width="2" stroke-linejoin="round"/>

    <!-- Checkmark inside shield -->
    <path d="M -6 0 L -2 4 L 6 -5" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Upward arrow (productivity increase) -->
    <g transform="translate(28, -10)">
      <path d="M 0 15 L 0 -5 M -4 0 L 0 -5 L 4 0" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Percentage symbol for improvement -->
    <g transform="translate(-25, -15)" opacity="0.8">
      <circle cx="0" cy="0" r="2" fill="#000"/>
      <line x1="-4" y1="4" x2="4" y2="-4" stroke="#000" stroke-width="1.5"/>
      <circle cx="0" cy="8" r="2" fill="#000"/>
    </g>
  </g>
</svg>