<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield with data bars - Blue and Black duotone -->

  <!-- Shield shape -->
  <path d="M 100 40 L 130 55 L 130 85 Q 100 115 100 115 Q 70 85 70 55 Z" fill="#3B82F6" stroke="#000" stroke-width="2" stroke-linejoin="round"/>

  <!-- Shield inner detail -->
  <path d="M 100 50 L 125 62 L 125 85 Q 100 110 100 110 Q 75 85 75 62 Z" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Check mark inside -->
  <path d="M 90 82 L 98 92 L 112 72" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data bars on left -->
  <rect x="50" y="130" width="5" height="15" fill="#000"/>
  <rect x="57" y="125" width="5" height="20" fill="#3B82F6" stroke="#000" stroke-width="1"/>
  <rect x="64" y="120" width="5" height="25" fill="#000"/>

  <!-- Upward arrow (improvement) -->
  <line x1="140" y1="135" x2="140" y2="110" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 135 115 L 140 108 L 145 115" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Percentage symbol or accent -->
  <circle cx="150" cy="125" r="3" fill="#000" opacity="0.6"/>
</svg>