<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Chart Trending Down (reduced incidents/costs) - Blue and Black duotone -->

  <!-- Axes -->
  <line x1="50" y1="130" x2="150" y2="130" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="130" x2="50" y2="50" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Axis labels/marks -->
  <line x1="45" y1="130" x2="50" y2="130" stroke="#000" stroke-width="1.5"/>
  <line x1="50" y1="135" x2="50" y2="130" stroke="#000" stroke-width="1.5"/>

  <!-- Bar 1 (high - incident/cost) -->
  <rect x="70" y="75" width="12" height="55" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

  <!-- Bar 2 (declining) -->
  <rect x="90" y="90" width="12" height="40" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

  <!-- Bar 3 (lower) -->
  <rect x="110" y="105" width="12" height="25" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

  <!-- Bar 4 (lowest) -->
  <rect x="130" y="115" width="12" height="15" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

  <!-- Trend line connecting bars -->
  <path d="M 76 75 L 96 90 L 116 105 L 136 115" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark or success indicator -->
  <circle cx="145" cy="55" r="8" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M 141 60 L 144 64 L 150 56" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Percentage label area -->
  <text x="155" y="125" font-size="12" font-weight="bold" fill="#000">25%</text>
</svg>