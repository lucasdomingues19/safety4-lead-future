<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- AI Sparkle - Blue and Black duotone -->

  <!-- Center star/sparkle -->
  <g transform="translate(100, 90)">
    <!-- Main star points -->
    <path d="M 0,-25 L 6,-8 L 24,-5 L 12,6 L 15,24 L 0,15 L -15,24 L -12,6 L -24,-5 L -6,-8 Z" fill="#3B82F6" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Outer sparkles/stars -->
  <g transform="translate(60, 60)">
    <path d="M 0,-12 L 3,-4 L 12,-3 L 6,2 L 8,12 L 0,8 L -8,12 L -6,2 L -12,-3 L -3,-4 Z" fill="#3B82F6" stroke="#000" stroke-width="1"/>
  </g>

  <g transform="translate(140, 60)">
    <path d="M 0,-12 L 3,-4 L 12,-3 L 6,2 L 8,12 L 0,8 L -8,12 L -6,2 L -12,-3 L -3,-4 Z" fill="#3B82F6" stroke="#000" stroke-width="1"/>
  </g>

  <g transform="translate(70, 130)">
    <path d="M 0,-12 L 3,-4 L 12,-3 L 6,2 L 8,12 L 0,8 L -8,12 L -6,2 L -12,-3 L -3,-4 Z" fill="#3B82F6" stroke="#000" stroke-width="1"/>
  </g>

  <g transform="translate(130, 130)">
    <path d="M 0,-12 L 3,-4 L 12,-3 L 6,2 L 8,12 L 0,8 L -8,12 L -6,2 L -12,-3 L -3,-4 Z" fill="#3B82F6" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Connecting lines between sparkles -->
  <line x1="75" y1="75" x2="85" y2="85" stroke="#000" stroke-width="1" opacity="0.6"/>
  <line x1="125" y1="75" x2="115" y2="85" stroke="#000" stroke-width="1" opacity="0.6"/>
</svg>