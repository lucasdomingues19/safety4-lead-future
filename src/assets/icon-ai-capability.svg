<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain with circuit pattern - Blue and Black duotone -->

  <!-- Left brain lobe -->
  <path d="M 70 85 Q 60 70 65 50 Q 75 60 80 85 Z" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

  <!-- Right brain lobe -->
  <path d="M 130 85 Q 140 70 135 50 Q 125 60 120 85 Z" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

  <!-- Center brain -->
  <ellipse cx="100" cy="90" rx="28" ry="32" fill="#3B82F6" stroke="#000" stroke-width="2"/>

  <!-- Brain wrinkles -->
  <path d="M 75 90 Q 85 95 95 90" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 105 85 Q 115 90 125 88" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Circuit lines -->
  <line x1="70" y1="85" x2="100" y2="85" stroke="#000" stroke-width="1.5"/>
  <line x1="100" y1="85" x2="130" y2="85" stroke="#000" stroke-width="1.5"/>
  <line x1="85" y1="70" x2="85" y2="95" stroke="#000" stroke-width="1" opacity="0.6"/>
  <line x1="115" y1="70" x2="115" y2="95" stroke="#000" stroke-width="1" opacity="0.6"/>

  <!-- Nodes -->
  <circle cx="85" cy="85" r="3" fill="#000"/>
  <circle cx="100" cy="85" r="3.5" fill="#3B82F6" stroke="#000" stroke-width="1"/>
  <circle cx="115" cy="85" r="3" fill="#000"/>

  <!-- Bottom connection -->
  <path d="M 90 115 L 110 115" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="115" r="2" fill="#000"/>
  <circle cx="110" cy="115" r="2" fill="#000"/>
</svg>