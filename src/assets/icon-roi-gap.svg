<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="85" r="55" fill="#E0E7FF" opacity="0.6"/>

  <!-- Left competitor bar (lower) -->
  <g opacity="0.6">
    <rect x="55" y="105" width="18" height="35" fill="#3B82F6" rx="2"/>
    <text x="55" y="155" font-size="11" font-weight="bold" fill="#3B82F6" opacity="0.7">1x</text>
  </g>

  <!-- Middle bar (middle height) -->
  <g opacity="0.75">
    <rect x="80" y="85" width="18" height="55" fill="url(#grad6)" rx="2"/>
  </g>

  <!-- Right competitor bar (leader - tallest) -->
  <g>
    <rect x="105" y="55" width="18" height="85" fill="url(#grad6)" rx="2"/>
    <path d="M 122 45 L 130 50 L 125 55" fill="#E0E7FF" opacity="0.9"/>
    <text x="105" y="155" font-size="11" font-weight="bold" fill="#3B82F6">6x</text>
  </g>

  <!-- Arrow showing gap -->
  <path d="M 75 50 Q 85 40 95 50" stroke="#E0E7FF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <text x="70" y="42" font-size="10" fill="#3B82F6" opacity="0.7" font-weight="bold">Gap</text>

  <!-- Trend line connecting tops -->
  <line x1="64" y1="102" x2="89" y2="82" stroke="#3B82F6" stroke-width="2" opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="89" y1="82" x2="114" y2="52" stroke="#3B82F6" stroke-width="2" opacity="0.6" stroke-dasharray="3,3"/>

  <!-- Performance indicator stars -->
  <g opacity="0.5">
    <circle cx="135" cy="35" r="2.5" fill="#E0E7FF"/>
    <circle cx="142" cy="32" r="2" fill="#E0E7FF"/>
    <circle cx="128" cy="42" r="1.5" fill="#3B82F6"/>
  </g>
</svg>