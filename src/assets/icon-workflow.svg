<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="workGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Left Box (Manual) -->
    <rect x="-40" y="-18" width="28" height="36" fill="url(#workGrad)" stroke="#000" stroke-width="2.5" rx="3"/>

    <!-- Lines in left box -->
    <line x1="-32" y1="-8" x2="-16" y2="-8" stroke="#000" stroke-width="1.5"/>
    <line x1="-32" y1="0" x2="-16" y2="0" stroke="#000" stroke-width="1.5"/>
    <line x1="-32" y1="8" x2="-20" y2="8" stroke="#000" stroke-width="1.5"/>

    <!-- Arrow (Process) -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#000" />
      </marker>
    </defs>

    <path d="M -8 0 Q 4 -12 18 0" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

    <!-- Right Box (Automated) -->
    <rect x="18" y="-18" width="28" height="36" fill="url(#workGrad)" stroke="#000" stroke-width="2.5" rx="3"/>

    <!-- Gears/automation -->
    <circle cx="26" cy="-4" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="26" y1="-9" x2="26" y2="1" stroke="#000" stroke-width="1"/>
    <line x1="21" y1="-4" x2="31" y2="-4" stroke="#000" stroke-width="1"/>

    <circle cx="36" cy="6" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="36" y1="1" x2="36" y2="11" stroke="#000" stroke-width="1"/>
    <line x1="31" y1="6" x2="41" y2="6" stroke="#000" stroke-width="1"/>

    <!-- Connection between gears -->
    <line x1="31" y1="0" x2="31" y2="6" stroke="#000" stroke-width="1.5" opacity="0.6"/>

    <!-- Efficiency spark -->
    <g transform="translate(50, -22)">
      <circle cx="0" cy="0" r="1.5" fill="#000"/>
      <path d="M 0 -6 L 0 6 M -6 0 L 6 0 M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>