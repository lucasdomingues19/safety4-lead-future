<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid/Framework structure - Blue and Black duotone -->

  <!-- Outer frame -->
  <rect x="55" y="48" width="90" height="90" fill="none" stroke="#000" stroke-width="2.5" rx="3"/>

  <!-- Vertical dividers -->
  <line x1="78" y1="48" x2="78" y2="138" stroke="#000" stroke-width="1.5"/>
  <line x1="101" y1="48" x2="101" y2="138" stroke="#000" stroke-width="1.5"/>
  <line x1="124" y1="48" x2="124" y2="138" stroke="#000" stroke-width="1.5"/>

  <!-- Horizontal dividers -->
  <line x1="55" y1="75" x2="145" y2="75" stroke="#000" stroke-width="1.5"/>
  <line x1="55" y1="101" x2="145" y2="101" stroke="#000" stroke-width="1.5"/>

  <!-- Fill sections with blue -->
  <rect x="55" y="48" width="23" height="27" fill="#3B82F6"/>
  <rect x="101" y="48" width="24" height="27" fill="#3B82F6"/>
  <rect x="78" y="75" width="23" height="26" fill="#3B82F6"/>
  <rect x="124" y="101" width="21" height="37" fill="#3B82F6"/>

  <!-- Center connection node -->
  <circle cx="100" cy="87" r="5" fill="#000" stroke="#000" stroke-width="1"/>

  <!-- Intersection nodes -->
  <circle cx="67" cy="63" r="2.5" fill="#000"/>
  <circle cx="112" cy="63" r="2.5" fill="#000"/>
  <circle cx="90" cy="125" r="2.5" fill="#000"/>

  <!-- Top accent -->
  <path d="M 95 42 L 100 35 L 105 42" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
</svg>