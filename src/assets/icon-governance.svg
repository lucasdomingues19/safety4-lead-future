<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="85" r="55" fill="#E0E7FF" opacity="0.6"/>

  <!-- Grid/Framework structure -->
  <rect x="60" y="50" width="80" height="70" fill="none" stroke="url(#grad5)" stroke-width="3" rx="4"/>

  <!-- Vertical dividers -->
  <line x1="80" y1="50" x2="80" y2="120" stroke="#3B82F6" stroke-width="2" opacity="0.8"/>
  <line x1="100" y1="50" x2="100" y2="120" stroke="#3B82F6" stroke-width="2" opacity="0.8"/>
  <line x1="120" y1="50" x2="120" y2="120" stroke="#1E40AF" stroke-width="2" opacity="0.6"/>

  <!-- Horizontal divider -->
  <line x1="60" y1="75" x2="140" y2="75" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
  <line x1="60" y1="95" x2="140" y2="95" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>

  <!-- Center connection node -->
  <circle cx="100" cy="85" r="5" fill="url(#grad5)"/>

  <!-- Nodes at intersections -->
  <circle cx="70" cy="65" r="2.5" fill="#E0E7FF" opacity="0.7"/>
  <circle cx="90" cy="65" r="2.5" fill="#E0E7FF" opacity="0.7"/>
  <circle cx="130" cy="105" r="2.5" fill="#E0E7FF" opacity="0.5"/>

  <!-- Missing/broken section indicator (gap on right) -->
  <path d="M 135 50 L 145 55 L 140 65" fill="#E0E7FF" opacity="0.6"/>
</svg>