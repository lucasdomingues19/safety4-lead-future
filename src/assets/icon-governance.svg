<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield with Crack - Blue and Black duotone -->

  <!-- Shield shape -->
  <path d="M 100 35 L 135 55 L 135 90 Q 100 120 100 120 Q 65 90 65 55 Z" fill="#3B82F6" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Shield inner outline -->
  <path d="M 100 45 L 130 62 L 130 90 Q 100 115 100 115 Q 70 90 70 62 Z" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Large crack down the middle -->
  <path d="M 100 40 Q 98 70 100 110" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Secondary cracks branching off -->
  <path d="M 100 65 Q 92 68 88 75" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 85 Q 108 88 112 95" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Small broken pieces -->
  <circle cx="88" cy="70" r="2" fill="#000" opacity="0.6"/>
  <circle cx="112" cy="80" r="2" fill="#000" opacity="0.6"/>

  <!-- Damage indicator lines -->
  <line x1="95" y1="50" x2="92" y2="58" stroke="#000" stroke-width="1" opacity="0.5"/>
  <line x1="105" y1="50" x2="108" y2="58" stroke="#000" stroke-width="1" opacity="0.5"/>

  <!-- Warning mark inside crack -->
  <text x="100" y="95" font-size="18" font-weight="bold" fill="#000" text-anchor="middle" opacity="0.4">!</text>
</svg>