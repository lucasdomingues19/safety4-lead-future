<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="govGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Central Node (Leader) -->
    <circle cx="0" cy="-28" r="9" fill="url(#govGrad)" stroke="#000" stroke-width="2"/>

    <!-- Connecting lines from center -->
    <line x1="-14" y1="-18" x2="0" y2="-19" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="-18" x2="0" y2="-19" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-18" y1="8" x2="-4" y2="-6" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="8" x2="4" y2="-6" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="0" y2="-19" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Node -->
    <circle cx="-24" cy="-12" r="8" fill="url(#govGrad)" stroke="#000" stroke-width="1.5"/>

    <!-- Right Node -->
    <circle cx="24" cy="-12" r="8" fill="url(#govGrad)" stroke="#000" stroke-width="1.5"/>

    <!-- Left Bottom Nodes -->
    <circle cx="-28" cy="18" r="7" fill="url(#govGrad)" stroke="#000" stroke-width="1.5"/>
    <circle cx="-12" cy="20" r="7" fill="url(#govGrad)" stroke="#000" stroke-width="1.5"/>

    <!-- Right Bottom Nodes -->
    <circle cx="12" cy="20" r="7" fill="url(#govGrad)" stroke="#000" stroke-width="1.5"/>
    <circle cx="28" cy="18" r="7" fill="url(#govGrad)" stroke="#000" stroke-width="1.5"/>

    <!-- Additional connectors for structure -->
    <line x1="-28" y1="11" x2="-18" y2="0" stroke="#000" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    <line x1="28" y1="11" x2="18" y2="0" stroke="#000" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>