<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Scale AI Implementation - Network/Growth -->
  <g transform="translate(100, 90)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="8" fill="#3B82F6" stroke="#000" stroke-width="2"/>

    <!-- Connected nodes forming network -->
    <circle cx="-22" cy="-15" r="6" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
    <circle cx="22" cy="-15" r="6" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
    <circle cx="-20" cy="20" r="6" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="6" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

    <!-- Connection lines -->
    <line x1="-15" y1="-10" x2="-7" y2="-5" stroke="#000" stroke-width="1.5"/>
    <line x1="15" y1="-10" x2="7" y2="-5" stroke="#000" stroke-width="1.5"/>
    <line x1="-15" y1="15" x2="-5" y2="5" stroke="#000" stroke-width="1.5"/>
    <line x1="15" y1="15" x2="5" y2="5" stroke="#000" stroke-width="1.5"/>

    <!-- Growth arrow upward -->
    <path d="M 32 -15 L 32 5 M 28 -5 L 32 0 L 36 -5" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>