<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="50" y="40" width="100" height="100" rx="8" fill="#E0E7FF" opacity="0.6"/>

  <!-- Clock circle -->
  <circle cx="100" cy="75" r="40" fill="url(#grad2)"/>

  <!-- Clock face inner -->
  <circle cx="100" cy="75" r="32" fill="#3B82F6" opacity="0.8"/>

  <!-- Hour markers -->
  <line x1="100" y1="47" x2="100" y2="52" stroke="#E0E7FF" stroke-width="2"/>
  <line x1="128" y1="75" x2="123" y2="75" stroke="#E0E7FF" stroke-width="2"/>

  <!-- Clock hands -->
  <line x1="100" y1="75" x2="100" y2="55" stroke="#E0E7FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="75" x2="115" y2="75" stroke="#E0E7FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="100" cy="75" r="3" fill="#E0E7FF"/>

  <!-- Papers/documents stacked -->
  <g opacity="0.7">
    <rect x="55" y="130" width="30" height="25" fill="#3B82F6" rx="2"/>
    <line x1="60" y1="138" x2="80" y2="138" stroke="#E0E7FF" stroke-width="1.5"/>
    <line x1="60" y1="145" x2="75" y2="145" stroke="#E0E7FF" stroke-width="1.5"/>
  </g>

  <!-- More papers -->
  <g opacity="0.5">
    <rect x="62" y="135" width="30" height="25" fill="#1E40AF" rx="2"/>
  </g>

  <!-- Accent circles -->
  <circle cx="145" cy="130" r="5" fill="#3B82F6" opacity="0.6"/>
  <circle cx="155" cy="145" r="4" fill="#E0E7FF" opacity="0.5"/>
</svg>