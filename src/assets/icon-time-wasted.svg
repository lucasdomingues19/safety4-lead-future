<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock with documents - Blue and Black duotone -->

  <!-- Clock circle -->
  <circle cx="100" cy="75" r="38" fill="#3B82F6" stroke="#000" stroke-width="2"/>

  <!-- Clock face ring -->
  <circle cx="100" cy="75" r="32" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- Hour markers -->
  <line x1="100" y1="47" x2="100" y2="51" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="75" x2="124" y2="75" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="103" x2="100" y2="99" stroke="#000" stroke-width="1.5"/>
  <line x1="72" y1="75" x2="76" y2="75" stroke="#000" stroke-width="1.5"/>

  <!-- Clock hands -->
  <line x1="100" y1="75" x2="100" y2="55" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="75" x2="115" y2="75" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="100" cy="75" r="3.5" fill="#000"/>

  <!-- Document 1 -->
  <rect x="52" y="128" width="28" height="32" fill="#3B82F6" stroke="#000" stroke-width="1.5" rx="2"/>
  <line x1="58" y1="138" x2="76" y2="138" stroke="#000" stroke-width="1.5"/>
  <line x1="58" y1="146" x2="72" y2="146" stroke="#000" stroke-width="1.5"/>

  <!-- Document 2 (offset) -->
  <rect x="60" y="136" width="28" height="32" fill="#3B82F6" stroke="#000" stroke-width="1.5" rx="2" opacity="0.7"/>
  <line x1="66" y1="146" x2="80" y2="146" stroke="#000" stroke-width="1"/>

  <!-- Document 3 (offset more) -->
  <rect x="68" y="144" width="28" height="32" fill="#3B82F6" stroke="#000" stroke-width="1.5" rx="2" opacity="0.5"/>
</svg>