<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Documents & Hourglass - Blue and Black duotone -->

  <!-- Hourglass outline -->
  <path d="M 60 50 L 60 80 Q 65 90 75 90 Q 85 90 90 80 L 90 50 Z" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M 60 50 L 90 50" stroke="#000" stroke-width="2" stroke-linecap="round"/>

  <!-- Upper hourglass chamber (blue) -->
  <path d="M 62 52 L 62 75 Q 65 85 75 85 Q 82 85 85 78 L 85 52 Z" fill="#3B82F6" stroke="none"/>

  <!-- Lower hourglass chamber (blue) -->
  <path d="M 60 100 L 60 120 L 90 120 L 90 100 Q 85 105 75 105 Q 65 105 60 100 Z" fill="#3B82F6" stroke="none"/>

  <!-- Hourglass bottom outline -->
  <path d="M 60 120 L 60 138 L 90 138 L 90 120" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sand flow in middle -->
  <path d="M 72 85 L 75 95 L 78 85" fill="#000" opacity="0.4"/>

  <!-- Document stack -->
  <!-- Document 1 (back) -->
  <rect x="105" y="55" width="35" height="42" fill="#3B82F6" stroke="#000" stroke-width="1.5" rx="2"/>
  <line x1="112" y1="68" x2="133" y2="68" stroke="#000" stroke-width="1.5"/>
  <line x1="112" y1="78" x2="128" y2="78" stroke="#000" stroke-width="1"/>
  <line x1="112" y1="86" x2="125" y2="86" stroke="#000" stroke-width="1"/>

  <!-- Document 2 (middle) -->
  <rect x="113" y="62" width="35" height="42" fill="#3B82F6" stroke="#000" stroke-width="1.5" rx="2"/>
  <line x1="120" y1="75" x2="141" y2="75" stroke="#000" stroke-width="1.5"/>
  <line x1="120" y1="85" x2="136" y2="85" stroke="#000" stroke-width="1"/>

  <!-- Document 3 (front) -->
  <rect x="121" y="69" width="35" height="42" fill="#3B82F6" stroke="#000" stroke-width="2" rx="2"/>
  <line x1="128" y1="82" x2="149" y2="82" stroke="#000" stroke-width="1.5"/>
  <line x1="128" y1="92" x2="144" y2="92" stroke="#000" stroke-width="1.5"/>
</svg>