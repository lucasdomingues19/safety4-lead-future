<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Chart Frame -->
    <rect x="-38" y="-30" width="76" height="50" fill="none" stroke="#000" stroke-width="2.5" rx="4"/>

    <!-- Grid lines -->
    <line x1="-38" y1="-10" x2="38" y2="-10" stroke="#E0E7FF" stroke-width="0.5"/>
    <line x1="-38" y1="10" x2="38" y2="10" stroke="#E0E7FF" stroke-width="0.5"/>

    <!-- Vertical Bars -->
    <rect x="-28" y="-2" width="8" height="22" fill="url(#dataGrad)" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="-16" y="-12" width="8" height="32" fill="url(#dataGrad)" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="-4" y="-8" width="8" height="28" fill="url(#dataGrad)" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="8" y="-18" width="8" height="38" fill="url(#dataGrad)" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="20" y="-6" width="8" height="26" fill="url(#dataGrad)" stroke="#000" stroke-width="1.5" rx="1"/>

    <!-- Trend Line connecting bar tops -->
    <path d="M -24 -2 L -12 -12 L 0 -8 L 12 -18 L 24 -6" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Magnifying Glass (Insight indicator) -->
    <g transform="translate(45, -32)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#dataGrad)" stroke-width="2.5"/>
      <line x1="7" y1="7" x2="14" y2="14" stroke="url(#dataGrad)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>