<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Data-Driven Insights -->
  <g transform="translate(100, 90)">
    <!-- Chart/Graph background -->
    <rect x="-30" y="-20" width="60" height="40" fill="none" stroke="#000" stroke-width="2" rx="3"/>

    <!-- Vertical bars -->
    <rect x="-20" y="-5" width="6" height="15" fill="#3B82F6" stroke="#000" stroke-width="1"/>
    <rect x="-10" y="-12" width="6" height="22" fill="#3B82F6" stroke="#000" stroke-width="1"/>
    <rect x="0" y="-8" width="6" height="18" fill="#3B82F6" stroke="#000" stroke-width="1"/>
    <rect x="10" y="-15" width="6" height="25" fill="#3B82F6" stroke="#000" stroke-width="1"/>
    <rect x="20" y="-10" width="6" height="20" fill="#3B82F6" stroke="#000" stroke-width="1"/>

    <!-- Trend line connecting tops -->
    <path d="M -17 -5 L -7 -12 L 3 -8 L 13 -15 L 23 -10" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Magnifying glass for insight -->
    <circle cx="35" cy="-25" r="8" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <line x1="40" y1="-20" x2="45" y2="-15" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>