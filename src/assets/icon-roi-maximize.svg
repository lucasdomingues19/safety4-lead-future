<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Chart Container -->
  <g transform="translate(100, 100)">
    <!-- Grid background -->
    <rect x="-45" y="-40" width="90" height="65" fill="none" stroke="#E0E7FF" stroke-width="0.5" opacity="0.5"/>

    <!-- Y-Axis -->
    <line x1="-45" y1="25" x2="-40" y2="25" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-42" y1="25" x2="-42" y2="-35" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- X-Axis -->
    <line x1="-42" y1="25" x2="42" y2="25" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bars with gradient -->
    <rect x="-32" y="5" width="10" height="20" fill="url(#roiGrad)" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="-18" y="-10" width="10" height="35" fill="url(#roiGrad)" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="-4" y="-22" width="10" height="47" fill="url(#roiGrad)" stroke="#000" stroke-width="1.5" rx="1"/>
    <rect x="10" y="-32" width="10" height="57" fill="url(#roiGrad)" stroke="#000" stroke-width="1.5" rx="1"/>

    <!-- Trend Line -->
    <path d="M -27 5 L -13 -10 L 1 -22 L 15 -32" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dollar Sign -->
    <g transform="translate(38, -38)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="url(#roiGrad)" stroke-width="2"/>
      <text x="0" y="4" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">$</text>
    </g>

    <!-- Accent dots on trend -->
    <circle cx="-27" cy="5" r="2.5" fill="#000"/>
    <circle cx="-13" cy="-10" r="2.5" fill="#000"/>
    <circle cx="1" cy="-22" r="2.5" fill="#000"/>
    <circle cx="15" cy="-32" r="2.5" fill="#000"/>
  </g>
</svg>