<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Compliance/Certificate -->
  <g transform="translate(100, 90)">
    <!-- Certificate/Document -->
    <rect x="-28" y="-25" width="56" height="48" fill="#3B82F6" stroke="#000" stroke-width="2" rx="3"/>

    <!-- Document lines (text) -->
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#000" stroke-width="1.5"/>
    <line x1="-20" y1="-8" x2="15" y2="-8" stroke="#000" stroke-width="1"/>
    <line x1="-20" y1="-1" x2="18" y2="-1" stroke="#000" stroke-width="1"/>

    <!-- Checkmark in circle (verification) -->
    <circle cx="0" cy="15" r="10" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M -4 15 L -1 18 L 5 12" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ribbon/Badge -->
    <path d="M -25 23 L -18 28 L -18 35" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
    <path d="M 25 23 L 18 28 L 18 35" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
  </g>
</svg>