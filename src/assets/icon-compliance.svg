<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Certificate/Document -->
    <rect x="-35" y="-32" width="70" height="56" fill="url(#compGrad)" stroke="#000" stroke-width="2.5" rx="4"/>

    <!-- Document Content Lines -->
    <line x1="-26" y1="-20" x2="26" y2="-20" stroke="#000" stroke-width="2"/>
    <line x1="-26" y1="-10" x2="20" y2="-10" stroke="#000" stroke-width="1.5"/>
    <line x1="-26" y1="0" x2="22" y2="0" stroke="#000" stroke-width="1.5"/>

    <!-- Decorative Line -->
    <line x1="-28" y1="12" x2="28" y2="12" stroke="#000" stroke-width="1" opacity="0.5"/>

    <!-- Checkmark Circle (Verification) -->
    <circle cx="0" cy="22" r="12" fill="none" stroke="#000" stroke-width="2.5"/>
    <path d="M -5 22 L -1 26 L 7 18" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ribbons (Certificate badges) -->
    <path d="M -30 24 L -24 30 L -24 38 L -30 32 Z" fill="url(#compGrad)" stroke="#000" stroke-width="1.5"/>
    <path d="M 30 24 L 24 30 L 24 38 L 30 32 Z" fill="url(#compGrad)" stroke="#000" stroke-width="1.5"/>
  </g>
</svg>