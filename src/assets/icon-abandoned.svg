<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Falling project box - Blue and Black duotone -->

  <!-- Project box top -->
  <rect x="65" y="52" width="70" height="48" fill="#3B82F6" stroke="#000" stroke-width="2" rx="3"/>

  <!-- Box lid/top flap -->
  <path d="M 65 52 L 75 38 L 125 38 L 135 52 Z" fill="#3B82F6" stroke="#000" stroke-width="2"/>

  <!-- Box lines/divisions -->
  <line x1="75" y1="68" x2="125" y2="68" stroke="#000" stroke-width="1.5"/>
  <line x1="77" y1="80" x2="120" y2="80" stroke="#000" stroke-width="1" opacity="0.6"/>

  <!-- Falling arrow / motion line -->
  <path d="M 100 105 Q 98 125 100 145" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 100 145 L 94 133" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 100 145 L 106 133" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- X mark (abandoned indicator) -->
  <line x1="138" y1="58" x2="150" y2="70" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="150" y1="58" x2="138" y2="70" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Speed lines -->
  <line x1="55" y1="110" x2="48" y2="110" stroke="#000" stroke-width="1.5" opacity="0.7"/>
  <line x1="58" y1="120" x2="50" y2="120" stroke="#000" stroke-width="1.5" opacity="0.6"/>
</svg>