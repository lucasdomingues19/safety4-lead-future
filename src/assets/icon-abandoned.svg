<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Broken Link - Blue and Black duotone -->

  <!-- Left link segment -->
  <rect x="45" y="70" width="35" height="22" fill="#3B82F6" stroke="#000" stroke-width="2" rx="11"/>

  <!-- Right link segment -->
  <rect x="120" y="70" width="35" height="22" fill="#3B82F6" stroke="#000" stroke-width="2" rx="11"/>

  <!-- Middle break/gap -->
  <circle cx="100" cy="81" r="12" fill="#FFF" stroke="#000" stroke-width="2.5"/>
  <path d="M 92 75 L 108 87 M 108 75 L 92 87" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Electrical/spark indicators around break -->
  <g opacity="0.7">
    <line x1="115" y1="65" x2="118" y2="58" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="125" y1="62" x2="132" y2="55" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="85" y1="65" x2="82" y2="58" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="75" y1="62" x2="68" y2="55" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Broken pieces falling -->
  <circle cx="70" cy="125" r="4" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
  <circle cx="130" cy="128" r="4" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>

  <!-- Motion lines showing failure -->
  <line x1="65" y1="140" x2="55" y2="145" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="135" y1="140" x2="145" y2="145" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>