<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="90" r="55" fill="#E0E7FF" opacity="0.6"/>

  <!-- Project/box structure -->
  <rect x="65" y="55" width="70" height="50" fill="url(#grad3)" rx="4"/>
  <rect x="65" y="55" width="70" height="50" fill="#3B82F6" opacity="0.7" rx="4"/>

  <!-- Top lid opening -->
  <path d="M 65 55 L 75 40 L 125 40 L 135 55" fill="#E0E7FF" opacity="0.8"/>

  <!-- Inner detail lines -->
  <line x1="75" y1="70" x2="125" y2="70" stroke="#E0E7FF" stroke-width="2" opacity="0.8"/>
  <line x1="75" y1="80" x2="120" y2="80" stroke="#E0E7FF" stroke-width="1.5" opacity="0.6"/>

  <!-- Falling/abandoned element (curved arrow down) -->
  <path d="M 100 100 Q 95 115 100 130" stroke="#1E40AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 100 130 L 95 120 M 100 130 L 105 120" stroke="#1E40AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- X mark showing abandoned -->
  <g opacity="0.6">
    <line x1="140" y1="60" x2="150" y2="70" stroke="#E0E7FF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="150" y1="60" x2="140" y2="70" stroke="#E0E7FF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>